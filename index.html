<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Freedom Finder — Route Prototype</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script defer src="/app.js"></script>
<style>
  :root {
    --navy: #0d1220;
    --panel: #1a2133;
    --parchment: #ece1c4;
    --muted: #b8ac8c;
    --brass: #c79a4b;
    --brick: #c2503f;
    --blue: #4a8fd6;
    --line: rgba(199, 154, 75, 0.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    background: var(--navy);
    color: var(--parchment);
    font-family: Georgia, "Times New Roman", serif;
    padding-top: env(safe-area-inset-top, 0px);
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 700;
    font-size: 1.1rem;
    border-bottom: 1px solid var(--line);
  }
  header .tag {
    margin-left: auto;
    font-family: inherit;
    font-weight: 400;
    font-size: 0.75rem;
    color: var(--brass);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 2px 8px;
  }
  .panel {
    padding: 12px 16px 14px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    display: grid;
    gap: 8px;
  }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    padding: 12px 12px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: #0f1626;
    color: var(--parchment);
    font: inherit;
    font-size: 1rem;
  }
  input::placeholder { color: #7f775f; }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 4px;
  }
  #loc {
    width: 48px;
    border: 1px solid var(--line);
    background: #0f1626;
    color: var(--parchment);
    font-size: 1.1rem;
  }
  #go {
    padding: 13px 16px;
    border: none;
    background: var(--brass);
    color: #14110f;
    font-weight: 600;
    font-size: 1rem;
  }
  #go:disabled { opacity: 0.6; cursor: default; }
  #status {
    height: 2.8em;
    line-height: 1.4;
    overflow-y: auto;
    overflow-wrap: anywhere;
    font-size: 0.88rem;
    color: var(--muted);
  }
  #status.err { color: #ff9b8a; }
  #mapwrap { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; background: #0d1220; }
  #card {
    position: absolute;
    left: 10px;
    right: 10px;
    bottom: calc(30px + env(safe-area-inset-bottom, 0px));
    z-index: 1000;
    background: rgba(13, 18, 32, 0.96);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 12px 10px;
    max-width: 560px;
    margin: 0 auto;
  }
  .rt {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 6px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  .rt.sel { border-color: var(--line); background: rgba(236, 225, 196, 0.06); }
  .rt i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .rt div { flex: 1; display: flex; flex-direction: column; line-height: 1.25; }
  .rt b { font-family: inherit; }
  .rt span { font-size: 0.85rem; color: var(--muted); }
  .rt em { font-style: normal; font-weight: 600; white-space: nowrap; }
  .note { margin: 6px 6px 2px; font-size: 0.9rem; color: var(--brass); }
  .fine { margin: 2px 6px 0; font-size: 0.74rem; color: #8f876c; }
  .leaflet-container { font-family: inherit; }
</style>
</head>
<body>

<header>
  <span>🦅</span> Freedom Finder
  <span class="tag">prototype</span>
</header>

<section class="panel">
  <div class="row">
    <input id="from" placeholder="Start (address or place)" autocomplete="off">
    <button id="loc" title="Use my location" aria-label="Use my location">📍</button>
  </div>
  <input id="to" placeholder="Destination" autocomplete="off">
  <button id="go" disabled>Find routes</button>
  <div id="status" role="status"></div>
</section>

<div id="mapwrap">
  <div id="map"></div>
  <div id="card" hidden></div>
</div>

<noscript><p class="note">Enable JavaScript to load the map and find routes.</p></noscript>
</body>
</html>
